name: Release Fr33Music

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release (ej. v1.0.1). Deja vacío para auto-generar según versión'
        required: false
        default: ''
  schedule:
    # Ejecución automática semanal los domingos a las 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: Decodificar Keystore para firma
        if: "${{ env.KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ${{ github.workspace }}/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/keystore/release.jks

      - name: Compilar APK de Release con Gradle
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Determinar Tag y Versión
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/')
            TAG="v${VERSION}.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Crear Release en GitHub y adjuntar APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Fr33Music ${{ steps.release_info.outputs.tag }}"
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
